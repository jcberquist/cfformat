# The configuration of `cargo about`, which generates THIRD-PARTY-LICENSES.md
# from Cargo.lock (the command is in AGENTS.md). Both binaries statically link
# every crate in their dependency graphs, so the notices of all of them ship
# with the releases.

# The licences the shipped crates are used under, in priority order: a crate
# offering a choice (`MIT OR Apache-2.0`) is taken under the first of these
# that satisfies it. This is exactly the set found in the dependency graph;
# a new dependency under any other licence makes the generation fail, which
# is the point: it is a decision to take, not something to slip through.
# `Unicode-3.0` is the ICU4X crates and the Unicode tables, `Apache-2.0`
# the one crate (`similar`) that offers nothing else, `BSL-1.0` the Boost
# side of `dragonbox_ecma` (`Apache-2.0 WITH LLVM-exception OR BSL-1.0`).
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "BSL-1.0"]

# The release targets (.github/workflows/release.yml); a crate that only
# builds elsewhere (wasm, redox, …) is left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Build scripts and their dependencies run at build time, and dev
# dependencies only in the tests: no code of theirs is in a binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Clarifications: where a crate's licence text is not found in the crate
# directory, the file to use, pinned by its checksum. When the text changes
# the tool only warns and scans the crate as if the entry were not there;
# CI fails on that warning, and the checksum is updated with the text.

# The workspace's own crates are the root LICENSE. They are MIT like the
# rest, but they are not third party: about.hbs leaves them out, and
# LICENSE ships on its own.

[cfcli.clarify]
license = "MIT"

[[cfcli.clarify.files]]
path = "../../LICENSE"
checksum = "e187da01edaeb7ea140ab0b1141d75e361f647f88276f66dabbd3e7914f756c2"

