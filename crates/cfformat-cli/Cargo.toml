[package]
name = "cfformat-cli"
version.workspace = true
description = "The cfformat command line: files, walking, diffs and parallelism over the cfformat library"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The package is `cfformat-cli` so the library keeps the name `cfformat` and
# none of the command line's dependencies; the binary is `cfformat`.
[[bin]]
name = "cfformat"
path = "src/main.rs"
# Not documented, as it was not inside the `cfformat` package (a binary named
# like the library is skipped by `cargo doc`): its doc comments are clap's
# help text, `<script>` and all, not rustdoc.
doc = false

[dependencies]
cfformat = { path = "../cfformat" }
cfcli = { path = "../cfcli" }
serde_json = { workspace = true }
similar = "2"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
rayon = "1.12.0"
