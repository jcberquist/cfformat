[package]
name = "cfformat"
version.workspace = true
description = "CFML formatter built on cfparse and cfdoc"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cfparse = { path = "../cfparse" }
cfdoc = { path = "../cfdoc" }
serde = { workspace = true }
serde_json = { workspace = true }
globset = "0.4.20"
oxc_allocator = { workspace = true }
oxc_span = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_formatter = { workspace = true }
oxc_formatter_core = { workspace = true }
oxc_formatter_css = { workspace = true }
oxc_formatter_json = { workspace = true }

# The command line is its own package, `crates/cfformat-cli` (binary
# `cfformat`): clap, ignore and rayon are not in the library's graph.

[dev-dependencies]
# The integration tests' diffs of a golden or an idempotence failure.
similar = "2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "format"
harness = false
